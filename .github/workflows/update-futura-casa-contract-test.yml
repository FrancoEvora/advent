name: Update Futura Casa identity contract test

on:
  push:
    branches:
      - feature/futura-casa-bia-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/futura-casa-bia-identity
          fetch-depth: 0
      - name: Update identity assertions
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('tests/vitoria-runtime-v4.test.mts')
          text = path.read_text()
          old = '  assert.match(VITORIA_AGENT_SYSTEM_PROMPT, /Você é Bia, agente comercial digital/iu);\n'
          new = (
              '  assert.match(VITORIA_AGENT_SYSTEM_PROMPT, /Você é Bia, especialista imobiliária digital da Futura Casa/iu);\n'
              '  assert.match(VITORIA_AGENT_SYSTEM_PROMPT, /parceira da Évora Urbanismo/iu);\n'
              '  assert.match(VITORIA_AGENT_SYSTEM_PROMPT, /Nunca se apresente como funcionária ou especialista direta da Évora/iu);\n'
              '  assert.match(VITORIA_SUPERVISOR_SYSTEM_PROMPT, /especialista digital da Futura Casa, parceira da Évora Urbanismo/iu);\n'
          )
          if old not in text:
              raise SystemExit('assertion antiga não encontrada')
          path.write_text(text.replace(old, new))
          PY
      - name: Remove one-off workflow
        run: rm .github/workflows/update-futura-casa-contract-test.yml
      - name: Commit test contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Atualiza contrato de identidade da Bia"
          git push origin HEAD:feature/futura-casa-bia-identity
