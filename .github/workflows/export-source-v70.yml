name: Export source v7.0
on:
  push:
    branches:
      - agent/export-source-v70
  pull_request:
    branches:
      - main
  workflow_dispatch:
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack sanitized repository
        run: tar --exclude=.git --exclude=.next --exclude=node_modules --exclude='.env*' -czf /tmp/advent-source-v70.tar.gz .
      - uses: actions/upload-artifact@v4
        with:
          name: advent-source-v70
          path: /tmp/advent-source-v70.tar.gz
          retention-days: 1
