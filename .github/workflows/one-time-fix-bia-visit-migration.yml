name: One-time Bia visit migration fix

on:
  push:
    branches: [fix/bia-language-real-visit-scheduling]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[visit-migration-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bia-language-real-visit-scheduling
      - name: Patch migration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/migrations/20260818103000_bia_gateway_language_and_visit_scheduling.sql')
          text = path.read_text()
          old = '''  select session.*, experience.*
    into session_row, experience_row
  from crm_private.public_agent_sessions session
  join crm_private.public_agent_experiences experience
    on experience.id = session.experience_id
  where experience.slug = lower(trim(p_slug))
    and experience.active
    and session.session_token_hash = p_session_token_hash
    and session.fingerprint_hash = p_fingerprint_hash
  for update of session;

  if not found then
    raise exception 'PUBLIC_AGENT_SESSION_NOT_FOUND';
  end if;
'''
          new = '''  select session.*
    into session_row
  from crm_private.public_agent_sessions session
  join crm_private.public_agent_experiences experience
    on experience.id = session.experience_id
  where experience.slug = lower(trim(p_slug))
    and experience.active
    and session.session_token_hash = p_session_token_hash
    and session.fingerprint_hash = p_fingerprint_hash
  for update of session;

  if not found then
    raise exception 'PUBLIC_AGENT_SESSION_NOT_FOUND';
  end if;

  select experience.*
    into experience_row
  from crm_private.public_agent_experiences experience
  where experience.id = session_row.experience_id
    and experience.active;

  if not found then
    raise exception 'PUBLIC_AGENT_EXPERIENCE_NOT_FOUND';
  end if;
'''
          if old not in text:
              raise SystemExit('target block not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/migrations/20260818103000_bia_gateway_language_and_visit_scheduling.sql
          git commit -m 'fix: load visit scheduling rows explicitly [visit-migration-fixed]'
          git push origin HEAD:fix/bia-language-real-visit-scheduling
