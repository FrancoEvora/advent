name: Apply Futura Casa Bia identity

on:
  push:
    branches:
      - feature/futura-casa-bia-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/futura-casa-bia-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply identity changes
        run: |
          node scripts/apply-futura-casa-public.mjs
          node scripts/apply-futura-casa-edge.mjs
      - name: Remove one-off automation
        run: |
          rm scripts/apply-futura-casa-public.mjs
          rm scripts/apply-futura-casa-edge.mjs
          rm .github/workflows/apply-futura-casa-bia-identity.yml
      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Alinha Bia à identidade da Futura Casa"
          git push origin HEAD:feature/futura-casa-bia-identity
