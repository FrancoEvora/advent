name: One-time Bia gateway type fix

on:
  push:
    branches: [fix/bia-language-real-visit-scheduling]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[gateway-body-fixed]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/bia-language-real-visit-scheduling
      - name: Fix fetch body type
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('supabase/functions/enterprise-vitoria-agent-gateway/index.ts')
          text = path.read_text()
          old = 'body: bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.byteLength),'
          if old not in text:
              raise SystemExit('target not found')
          path.write_text(text.replace(old, 'body: bytes,', 1))
          PY
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add supabase/functions/enterprise-vitoria-agent-gateway/index.ts
          git commit -m 'fix: pass gateway body as Uint8Array [gateway-body-fixed]'
          git push origin HEAD:fix/bia-language-real-visit-scheduling
