name: Import Solaris book assets once
on:
  push:
    branches: [codex/solaris-book-v6-20260915]
    paths: [.github/workflows/import-solaris-book-once.yml]
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Import verified source package
        env:
          PACKAGE_URL: 'https://sdmntprcentralus.oaiusercontent.com/files/00000000-d4a8-81f5-a69c-99b91b0d46e6/raw?se=2026-09-15T13%3A37%3A46Z&sp=r&sv=2026-02-06&sr=b&scid=a0a897e0-72d7-5782-938b-48a4cd311e9e&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T12%3A21%3A21Z&ske=2026-09-16T12%3A21%3A21Z&sks=b&skv=2026-02-06&sig=EFRo0jSYhEnzQHWy6A6meWJojq6WZZ67WU9YX2XP7gM%3D'
        run: |
          python - <<'PY'
          import hashlib, io, os, pathlib, urllib.request, zipfile
          raw = urllib.request.urlopen(os.environ['PACKAGE_URL'], timeout=90).read(15000000)
          assert hashlib.sha256(raw).hexdigest() == '4db553d52e2631a9e949f55af02a5873a38d4abf6b2c8fff02ab5e38bd3e73a6', 'Package checksum mismatch'
          exact = {'src/components/forms/SolarisForm.tsx', 'src/components/forms/SolarisCaptureForm.tsx', 'src/components/forms/solaris-form.module.css', 'src/app/atendimento/[slug]/cadastro/page.tsx'}
          with zipfile.ZipFile(io.BytesIO(raw)) as archive:
            for item in archive.infolist():
              path = pathlib.PurePosixPath(item.filename)
              assert not path.is_absolute() and '..' not in path.parts
              assert str(path) in exact or str(path).startswith('public/forms/solaris/book/'), 'Unexpected package path'
              assert item.file_size < 12000000
            archive.extractall('.')
          print('Verified Solaris landing source, original book crops and full 23-page web book imported.')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/components/forms/SolarisForm.tsx src/components/forms/SolarisCaptureForm.tsx src/components/forms/solaris-form.module.css 'src/app/atendimento/[slug]/cadastro/page.tsx' public/forms/solaris/book
          git commit -m 'feat(solaris): landing page based on commercial book V6 with source imagery'
          git push origin HEAD:codex/solaris-book-v6-20260915
