name: Solaris approved logo transfer
on:
  push:
    branches: [codex/solaris-logo-monocromatica-publicacao]
    paths: ['.github/workflows/solaris-mono-transfer.yml']
permissions:
  contents: write
jobs:
  transfer:
    if: github.repository == 'FrancoEvora/advent'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/solaris-logo-monocromatica-publicacao
      - name: Fetch and verify the approved public-brand package
        env:
          PACKAGE_URL: 'https://sdmntprbrazilsouth.oaiusercontent.com/files/00000000-6f44-820e-a0ce-62db3bef2997/raw?se=2026-09-16T00%3A06%3A50Z&sp=r&sv=2026-02-06&sr=b&scid=fb75b2b3-5137-5075-997a-b1f3f835dbf1&skoid=a6356955-0ca0-4033-9150-c0c162458498&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-15T21%3A15%3A55Z&ske=2026-09-16T21%3A15%3A55Z&sks=b&skv=2026-02-06&sig=w4phiyOJj05wIs7f2V/r6KRk1bCW7SKL51%2BP5oz0bSs%3D'
        run: |
          set -euo pipefail
          echo "::add-mask::$PACKAGE_URL"
          curl --fail --silent --show-error --location --max-time 60 "$PACKAGE_URL" -o "$RUNNER_TEMP/approved-logo.zip"
          echo "28bf80e9071c4a1db6a35818de2a260718490f96442502c8672c1440f4e88afa  $RUNNER_TEMP/approved-logo.zip" | sha256sum --check --strict
          mkdir -p "$RUNNER_TEMP/approved-logo"
          unzip -q "$RUNNER_TEMP/approved-logo.zip" -d "$RUNNER_TEMP/approved-logo"
          node "$RUNNER_TEMP/approved-logo/aplicar.mjs" --repo "$GITHUB_WORKSPACE" --check
          node "$RUNNER_TEMP/approved-logo/aplicar.mjs" --repo "$GITHUB_WORKSPACE"
          git diff --check
          git add public/forms/solaris/book/futura-casa-monocromatica-v1.webp src/components/forms/SolarisForm.tsx src/components/forms/solaris-downloads.module.css tests/solaris-downloads-browser.mjs
          git diff --cached --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(solaris): aplicar marca monocromatica transparente aprovada no rodape'
          git push origin HEAD:refs/heads/codex/solaris-logo-monocromatica-publicacao
