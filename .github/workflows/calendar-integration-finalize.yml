name: Validate and commit calendar integration
on:
  push:
    branches: [codex/arisa-google-calendar-20260906]
    paths: [.github/workflows/calendar-integration-finalize.yml]
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arisa-google-calendar-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Apply reviewed wiring
        shell: python
        run: |
          from pathlib import Path
          import textwrap
          source=Path('.github/workflows/calendar-integration-patch.yml').read_text()
          block=source.split('      - name: Wire Calendar into OAuth, chat and UI',1)[1].split('      - run: npm ci',1)[0]
          code=block.split('        run: |',1)[1]
          exec(textwrap.dedent(code))
      - run: npm ci
      - run: npm run check
      - name: Commit validated integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supabase/functions src/components/arisa
          git diff --cached --quiet && exit 1
          git commit -m "feat(arisa): wire Google Calendar and Meet into runtime"
          git push origin HEAD:codex/arisa-google-calendar-20260906
