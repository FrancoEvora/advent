name: Calendar handler compatibility
on:
  push:
    branches: [codex/arisa-google-calendar-20260906]
    paths: [.github/workflows/calendar-test-compat.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: codex/arisa-google-calendar-20260906
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Extend isolated handler module mapping
        shell: python
        run: |
          from pathlib import Path
          p=Path('tests/arisa-mail-handler.test.mts');s=p.read_text();s=s.replace('["arisa-manager","arisa-document","arisa-mail","arisa-mail-runtime"]','["arisa-manager","arisa-document","arisa-mail","arisa-mail-runtime","arisa-calendar","arisa-calendar-runtime"]');p.write_text(s)
          p=Path('tests/arisa-manager-handler.test.mts');s=p.read_text();needle='  .replaceAll(\'"../_shared/arisa-mail-runtime.ts"\', JSON.stringify(new URL("supabase/functions/_shared/arisa-mail-runtime.ts", root).href))\n';extra=needle+'  .replaceAll(\'"../_shared/arisa-calendar.ts"\', JSON.stringify(new URL("supabase/functions/_shared/arisa-calendar.ts", root).href))\n  .replaceAll(\'"../_shared/arisa-calendar-runtime.ts"\', JSON.stringify(new URL("supabase/functions/_shared/arisa-calendar-runtime.ts", root).href))\n';s=s.replace(needle,extra);p.write_text(s)
      - run: npm ci --no-audit --no-fund
      - run: node --test tests/arisa-mail-handler.test.mts tests/arisa-manager-handler.test.mts
      - name: Commit passing harness updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/arisa-mail-handler.test.mts tests/arisa-manager-handler.test.mts
          git commit -m "test(arisa): resolve calendar modules in handler harnesses"
          git push origin HEAD:codex/arisa-google-calendar-20260906
