name: CI AI Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --no-audit --no-fund
      - run: >-
          node --test
          tests/crm-ai-runtime-hardening.test.mjs
          tests/crm-ai-supervised-review.test.mjs
          tests/crm-ai-all-new-leads.test.mjs
          tests/crm-whatsapp-cloud-contract.test.mjs
          tests/vitoria-runtime-v4.test.mts
          tests/vitoria-contextual-post-hold-migration.test.mjs
          tests/vitoria-profile-avatar.test.mjs
          tests/bia-profile-migration.test.mjs
          tests/bia-language-visit-scheduling.test.mjs
      - name: Validate Arisa WhatsApp replies
        run: |
          node --test tests/arisa-manager.test.mts tests/arisa-whatsapp-runtime.test.mts tests/arisa-whatsapp-webhook.test.mts tests/arisa-whatsapp-replies.test.mts tests/arisa-whatsapp-attention.test.mts tests/arisa-whatsapp-finance.test.mts
          deno check supabase/functions/arisa-manager/index.ts supabase/functions/arisa-whatsapp-replies/index.ts supabase/functions/arisa-whatsapp-notifications/index.ts supabase/functions/arisa-whatsapp/index.ts
      - name: Validate Bia Edge Functions
        run: >-
          deno check
          supabase/functions/enterprise-vitoria-agent/index.ts
          supabase/functions/enterprise-vitoria-agent-gateway/index.ts
          supabase/functions/enterprise-bia-agent-gateway/index.ts
          supabase/functions/bia-whatsapp-outbound/index.ts
      - name: Validate Bia WhatsApp initiation
        run: node --test tests/bia-manager-twin.test.mts tests/arisa-manager-handler.test.mts tests/arisa-channels-ui.test.mjs tests/bia-whatsapp-channel.test.mts tests/bia-whatsapp-outbound.test.mts tests/bia-runtime-execution.test.mjs
