name: Evora Institutional QA
on:
  push:
    branches: [main]
    paths:
      - 'public/evora/**'
      - 'src/app/evora/**'
      - 'tests/evora-site-browser.mjs'
      - '.github/workflows/evora-institutional-qa.yml'
  pull_request:
    paths:
      - 'public/evora/**'
      - 'src/app/evora/**'
      - 'tests/evora-site-browser.mjs'
      - '.github/workflows/evora-institutional-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: evora-institutional-qa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install isolated browser runner
        run: |
          npm install --prefix "$RUNNER_TEMP/evora-qa" --no-save --package-lock=false playwright@1.58.2
          "$RUNNER_TEMP/evora-qa/node_modules/.bin/playwright" install --with-deps chromium
      - name: Verify public pages and interactions without submitting user data
        env:
          QA_NODE_MODULES: ${{ runner.temp }}/evora-qa/node_modules
        run: node tests/evora-site-browser.mjs
      - name: Package independent source
        if: always()
        run: |
          mkdir -p qa-output
          cp docs/evora-institucional.md qa-output/README.md
          (cd public/evora && zip -qr ../../qa-output/evora-urbanismo-site.zip .)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: evora-institutional-qa
          path: qa-output/
          retention-days: 14
