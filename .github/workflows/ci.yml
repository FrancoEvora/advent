name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: npm ci --no-audit --no-fund
      - name: Validate CRM AI safety contracts
        run: >-
          node --test
          tests/crm-ai-shadow-contract.test.mjs
          tests/crm-ai-supervised-review.test.mjs
          tests/vitoria-runtime-v4.test.mts
          tests/vitoria-contextual-post-hold-migration.test.mjs
          tests/vitoria-profile-avatar.test.mjs
          tests/bia-profile-migration.test.mjs
          tests/public-agent-mobile-viewport.test.mjs
          tests/bia-commercial-presentation.test.mjs
          tests/crm-broker-bia-knowledge.test.mjs
          tests/weekly-platform-audit-hardening.test.mjs
          tests/weekly-platform-audit-2026-08-31.test.mjs
      - name: Validate Bia execution regressions
        run: node --test tests/bia-runtime-execution.test.mjs
      - name: Validate Arisa financial and CRM operations
        run: >-
          node --test
          tests/arisa-crm-operations.test.mts
          tests/arisa-document-extraction.test.mts
          tests/arisa-operations-handler.test.mts
          tests/arisa-manager.test.mts
          tests/arisa-manager-handler.test.mts
          tests/arisa-installation.test.mjs
          tests/arisa-viewport.test.mts
          tests/arisa-mail-memory.test.mts
          tests/arisa-mail-handler.test.mts
          tests/arisa-contextual-communications.test.mts
          tests/arisa-whatsapp-runtime.test.mts
          tests/arisa-whatsapp-webhook.test.mts
          tests/arisa-channels-ui.test.mjs
          tests/arisa-message-links.test.mts
      - name: Validate Bia pure behavior contracts
        run: deno test tests/bia-professional-behavior.test.mts
      - name: Validate CRM conversation and archival contracts
        run: >-
          node --test
          tests/crm-conversation-history-archive.test.mjs
          tests/crm-conversation-history-hardening.test.mjs
          tests/crm-lead-archive-integrity.test.mjs
      - name: Validate Bia Edge Functions
        run: >-
          deno check
          supabase/functions/enterprise-vitoria-agent/index.ts
          supabase/functions/enterprise-vitoria-agent-gateway/index.ts
          supabase/functions/enterprise-bia-agent-gateway/index.ts
          supabase/functions/enterprise-bia-knowledge-admin/index.ts
          supabase/functions/arisa-operations/index.ts
          supabase/functions/arisa-manager/index.ts
          supabase/functions/arisa-mail/index.ts
          supabase/functions/arisa-background/index.ts
          supabase/functions/arisa-whatsapp/index.ts
          supabase/functions/enterprise-whatsapp-webhook/index.ts
      - run: npm run build
      - name: Validate Arisa home-screen HTTP metadata
        run: node --test tests/arisa-installation-http.test.mjs
