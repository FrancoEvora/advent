name: CI AI Runtime

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  runtime-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: >-
          node --test
          tests/crm-ai-runtime-hardening.test.mjs
          tests/crm-ai-supervised-review.test.mjs
