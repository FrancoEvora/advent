name: Export public production assets 7.3

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Collect public deployment assets
        shell: bash
        run: |
          mkdir -p /tmp/advent-assets
          cat > /tmp/collect-assets.mjs <<'NODE'
          import fs from 'node:fs/promises';
          import path from 'node:path';

          const origin = 'https://advent-tau.vercel.app';
          const output = '/tmp/advent-assets';
          const queue = ['/'];
          const visited = new Set();
          const downloadable = /\.(?:js|css|json|webmanifest|svg|png|jpg|jpeg|webp|ico|woff2?|map)(?:\?.*)?$/i;

          async function fetchAsset(pathname) {
            const url = new URL(pathname, origin);
            const response = await fetch(url, { redirect: 'follow' });
            if (!response.ok) {
              console.warn(`Skipping ${response.status}: ${url.href}`);
              return null;
            }
            return { url, response };
          }

          function discover(text, contentType, currentUrl) {
            const references = [];
            if (contentType.includes('text/html')) {
              for (const match of text.matchAll(/(?:src|href)=["']([^"']+)["']/g)) references.push(match[1]);
            }
            for (const match of text.matchAll(/["'](\/_next\/[^"']+\.(?:js|css|json|map)(?:\?[^"']*)?)["']/g)) references.push(match[1]);
            for (const match of text.matchAll(/["']((?:\.\.\/|\.\/)?static\/chunks\/[^"']+\.(?:js|css|json|map)(?:\?[^"']*)?)["']/g)) {
              const value = match[1].replace(/^(?:\.\.\/|\.\/)+/, '');
              references.push(`/_next/${value}`);
            }
            for (const match of text.matchAll(/["']([A-Za-z0-9_~.-]+\.(?:js|css|map))(?:\?[^"']*)?["']/g)) {
              if (currentUrl.pathname.includes('/_next/static/chunks/')) references.push(`/_next/static/chunks/${match[1]}`);
            }
            return references.filter((reference) => reference && !reference.includes('${') && !reference.startsWith('data:'));
          }

          while (queue.length) {
            const current = queue.shift();
            let normalized;
            try {
              normalized = new URL(current, origin);
            } catch {
              continue;
            }
            if (normalized.origin !== origin || visited.has(normalized.href)) continue;
            visited.add(normalized.href);

            const fetched = await fetchAsset(normalized.href);
            if (!fetched) continue;
            const { url, response } = fetched;
            const contentType = response.headers.get('content-type') || '';
            const bytes = Buffer.from(await response.arrayBuffer());
            const relative = url.pathname === '/' ? 'index.html' : url.pathname.replace(/^\//, '');
            const target = path.join(output, relative);
            await fs.mkdir(path.dirname(target), { recursive: true });
            await fs.writeFile(target, bytes);

            if (contentType.includes('text/html') || contentType.includes('javascript') || contentType.includes('text/css')) {
              const text = bytes.toString('utf8');
              for (const reference of discover(text, contentType, url)) {
                try {
                  const candidate = new URL(reference, url);
                  if (candidate.origin === origin && downloadable.test(candidate.pathname + candidate.search)) queue.push(candidate.href);
                } catch {
                  // Ignore malformed runtime strings.
                }
              }
            }
          }

          const files = [];
          async function walk(directory) {
            for (const entry of await fs.readdir(directory, { withFileTypes: true })) {
              const full = path.join(directory, entry.name);
              if (entry.isDirectory()) await walk(full);
              else files.push(path.relative(output, full));
            }
          }
          await walk(output);
          await fs.writeFile(path.join(output, 'PUBLIC_ASSET_MANIFEST.json'), JSON.stringify({ origin, exportedAt: new Date().toISOString(), files }, null, 2));
          console.log(`Collected ${files.length} public assets.`);
          NODE
          node /tmp/collect-assets.mjs
          tar -C /tmp/advent-assets -czf /tmp/advent-production-7.3-public-assets.tar.gz .

      - name: Upload public asset artifact
        uses: actions/upload-artifact@v4
        with:
          name: advent-production-7.3-public-assets
          path: /tmp/advent-production-7.3-public-assets.tar.gz
          retention-days: 1
