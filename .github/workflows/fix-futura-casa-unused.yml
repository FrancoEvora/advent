name: Fix Futura Casa identity cleanup

on:
  push:
    branches:
      - feature/futura-casa-bia-identity

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/futura-casa-bia-identity
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Remove obsolete greeting variables
        run: node scripts/remove-futura-casa-unused.mjs
      - name: Remove one-off automation
        run: |
          rm scripts/remove-futura-casa-unused.mjs
          rm .github/workflows/fix-futura-casa-unused.yml
      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet || git commit -m "Remove variáveis obsoletas da saudação da Bia"
          git push origin HEAD:feature/futura-casa-bia-identity
